capture:
  resolution:
  - 1280
  - 720
  fps: 30
  codec: MJPG
cameras:
  left:
    id: 2
    description: Left camera
  center:
    id: 1
    description: Center camera
  right:
    id: 0
    description: Right camera
camera_ids:
- 2
- 1
- 0
calibration:
  board:
    squares_x: 4
    squares_y: 6
    square_size_mm: 60.0
    marker_size_mm: 45.0
    dictionary: DICT_4X4_50
  thresholds:
    max_reprojection_error: 1.0
    min_detected_frames: 50
